name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push makes the in-flight run for the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the release workflow asks for more where it needs it.
permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 22

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migrations match the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Editing a Drizzle schema without generating the migration produces code
      # that passes every test and then fails on deploy against a real database.
      # Generating here must be a no-op; anything new means one was forgotten.
      - name: Check for ungenerated migrations
        env:
          DATABASE_URL: postgres://albumflow:albumflow@localhost:5432/albumflow
        run: |
          pnpm db:generate
          # `git status`, not `git diff`: a freshly generated migration is an
          # untracked file, which `git diff` does not report at all.
          drift=$(git status --porcelain -- apps/api/drizzle)
          if [ -n "$drift" ]; then
            echo "::error::The Drizzle schema has changes with no migration committed."
            echo "Run 'pnpm db:generate' and commit what it produces."
            echo "$drift"
            exit 1
          fi
          echo "Migrations are in step with the schema."

  images:
    name: Container images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the Dockerfiles still work on every PR,
      # which unit tests cannot tell you.
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: albumflow-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    name: End-to-end against the real stack
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `.env` is gitignored, and compose validates every service in the file —
      # including the api/worker ones this job does not start.
      - name: Provide a .env for compose
        run: cp .env.example .env

      - name: Start Postgres, Redis and MinIO
        run: docker compose up -d postgres redis minio

      # Probed directly rather than through compose healthchecks: a wrong
      # healthcheck would otherwise stall here with nothing useful to read.
      - name: Wait for the backing services
        run: |
          ready() { for i in $(seq 1 45); do eval "$2" >/dev/null 2>&1 && return 0; sleep 2; done
                    echo "::error::$1 never became ready"; return 1; }
          ready postgres "docker compose exec -T postgres pg_isready -U albumflow"
          ready redis    "docker compose exec -T redis redis-cli ping"
          ready minio    "curl -sf http://localhost:9000/minio/health/live"

      # Created with the AWS CLI already on the runner, so the stack does not
      # depend on `mc` being present inside the MinIO image.
      - name: Create the photo bucket
        env:
          AWS_ACCESS_KEY_ID: albumflow
          AWS_SECRET_ACCESS_KEY: albumflow123
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://albumflow-photos \
            || echo "bucket already exists"

      - name: Migrate
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://albumflow:albumflow@localhost:5432/albumflow

      - name: Run the API and worker
        env:
          DATABASE_URL: postgres://albumflow:albumflow@localhost:5432/albumflow
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_PUBLIC_ENDPOINT: http://localhost:9000
          S3_BUCKET: albumflow-photos
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: albumflow
          S3_SECRET_ACCESS_KEY: albumflow123
          S3_FORCE_PATH_STYLE: "true"
          WEB_ORIGIN: http://localhost:5173
          VISION_PROVIDER: heuristic
        run: |
          pnpm --filter @albumflow/api exec tsx src/server.ts > /tmp/api.log 2>&1 &
          pnpm --filter @albumflow/worker exec tsx src/worker.ts > /tmp/worker.log 2>&1 &

          for attempt in $(seq 1 30); do
            curl -sf http://localhost:4000/health && break
            sleep 2
          done
          curl -sf http://localhost:4000/health || { echo "::error::API never came up"; cat /tmp/api.log; exit 1; }

          # The API answering /health says nothing about the worker — it's a
          # separate process with its own cold start (tsx transpiling a fresh
          # dependency graph). Without this, a slow or crashed worker doesn't
          # fail here: it fails 90 seconds later, opaquely, inside the smoke
          # test's first upload check, with no indication of why.
          for attempt in $(seq 1 30); do
            grep -q "Worker listening on:" /tmp/worker.log && break
            sleep 2
          done
          grep -q "Worker listening on:" /tmp/worker.log \
            || { echo "::error::Worker never finished starting"; cat /tmp/worker.log; exit 1; }

      # Unit tests run on in-memory adapters. This is the only check that proves
      # Postgres migrated, Redis is reachable, the worker is consuming, and S3
      # credentials are right — the failures that only ever appear on deploy.
      - name: Smoke test
        env:
          DATABASE_URL: postgres://albumflow:albumflow@localhost:5432/albumflow
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_PUBLIC_ENDPOINT: http://localhost:9000
          S3_BUCKET: albumflow-photos
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: albumflow
          S3_SECRET_ACCESS_KEY: albumflow123
          S3_FORCE_PATH_STYLE: "true"
          WEB_ORIGIN: http://localhost:5173
          VISION_PROVIDER: heuristic
        run: |
          set +e
          pnpm --filter @albumflow/api smoke
          code=$?
          set -e
          # Printed every time, pass or fail, right here — not in a separate
          # step someone has to go find. BullMQ logs every failed *attempt*
          # (not just the final one), via worker.ts's own `worker.on("failed", ...)`
          # handler, so if a job is quietly retrying 2-3 times before it
          # eventually succeeds, the reason shows up here.
          echo "----- worker.log (tail) -----"
          tail -n 200 /tmp/worker.log || true
          exit $code

      - name: Server logs on failure
        if: failure()
        run: |
          echo "----- api -----";    tail -n 100 /tmp/api.log    || true
          echo "----- worker -----"; tail -n 100 /tmp/worker.log || true
          docker compose logs --tail 50

  deploy-backend:
    name: Deploy API + worker to the VPS
    runs-on: ubuntu-latest
    # Every gate, not just typecheck/test/build: migrations must match the
    # schema, all three images must build, and the smoke test must have
    # actually driven a photo through upload, analysis, review and export.
    needs: [verify, migrations, images, smoke]
    # Never on a PR: a fork could otherwise get a production deploy triggered
    # against it, and a fork cannot hold this repo's secrets anyway.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency: deploy-backend
    steps:
      - uses: actions/checkout@v4

      # Syncs the checkout into /opt/albumflow. This never includes a real
      # `.env` — it's gitignored, so it was never in this checkout to begin
      # with — which is exactly why the server's own `.env` (holding the
      # real secrets) survives every redeploy untouched.
      - name: Sync the release to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/opt/albumflow"
          overwrite: true

      # Migrate against the new code before any of it takes traffic, then
      # bring up exactly the services this box runs. `web` is deliberately
      # never listed — the frontend is static and lives on cPanel instead
      # (see docs/deploy-valentintruta.md), not on this VPS at all.
      - name: Migrate and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/albumflow
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $COMPOSE build api worker
            $COMPOSE run --rm api pnpm --filter @albumflow/api exec tsx src/db/migrate.ts
            $COMPOSE up -d postgres redis minio minio-init api worker caddy
            docker image prune -f

  deploy-web:
    name: Deploy web to valentintruta.ro (cPanel, FTP)
    runs-on: ubuntu-latest
    needs: [verify, migrations, images, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency: deploy-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Baked in at build time: a static bundle cannot read an env var at
      # runtime. VITE_API_URL is the one line that has to change if the
      # backend ever moves off this VPS. VITE_STUDIO_ID/VITE_STUDIO_API_KEY
      # authenticate every request the deployed app makes — without them it
      # falls back to a demo studio ID with no key at all, and every request
      # fails with 401. Create the real studio once with
      # `docker compose ... run --rm api pnpm --filter @albumflow/api db:seed`
      # on the server, then set its printed values as these two secrets.
      - name: Build
        run: pnpm --filter @albumflow/web build
        env:
          VITE_API_URL: https://api.valentintruta.ro
          VITE_STUDIO_ID: ${{ secrets.VITE_STUDIO_ID }}
          VITE_STUDIO_API_KEY: ${{ secrets.VITE_STUDIO_API_KEY }}

      # cPanel here has no SSH (confirmed: Security has no "SSH Access" icon),
      # so FTP is the deploy path. FTP_USERNAME should be a dedicated account
      # scoped to the subdomain's own directory in cPanel's FTP Accounts panel
      # — never the master account — so a leaked secret cannot reach WordPress
      # or anything else on the same hosting account.
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/web/dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
