name: Agent review

# The checker half of maker–checker: an agent that did not write the change reads it cold
# and reviews it. It can read the code and comment on the PR — nothing else. It never
# pushes, approves or merges; the merge button stays with a person.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Agent review
    # Drafts are work in progress; forks never receive this repository's secrets.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Reviewer not configured
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: |
          echo "::warning::Agent review skipped: add a CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) repository secret — see docs/agent-pipeline.md."

      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 0

      - name: Review
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Whichever is set: a Claude subscription token (`claude setup-token`) or an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            You are the reviewer in this repository's agent pipeline. Another agent (or a person)
            wrote this change; CI already enforces formatting, lint, types, tests with ≥80% coverage,
            the build and migrations, so do not re-report what those catch. Your job is what they
            cannot see. Read the diff (`gh pr diff`), then read the surrounding code it touches.

            Review for, in this order:
            1. Correctness — logic errors, broken edge cases, a behaviour change the PR does not mention.
            2. Security — tenancy (a studio reaching another studio's data), auth on new routes,
               secrets in code or logs, unescaped user text in emails or HTML, injection.
            3. Data — a Drizzle schema change without a migration, a destructive migration,
               anything that could lose a photographer's photos.
            4. Tests — new behaviour without a test that would fail if it broke.
            5. Architecture — the API is a DDD modular monolith with ports & adapters: use cases
               depend on ports, concrete adapters are chosen only in apps/api/src/composition/.
               The web app is organised as app/, shared/, features/<name>/{components,hooks,lib}.
            6. Errors and logging — failures logged with context; critical paths log at error level.

            How to report:
            - One inline comment per concrete problem (mcp__github_inline_comment__create_inline_comment),
              saying what breaks, for which input, and the fix. No comments on style or taste.
            - Then exactly one summary comment with `gh pr comment`. Its first line must be
              `<!-- agent-review -->`, its second line one of these verdicts, verbatim:
                Verdict: ✅ READY — no problems found that need fixing before merge.
                Verdict: ⚠️ SUGGESTIONS — worth fixing, nothing blocks a merge.
                Verdict: ⛔ BLOCKING — at least one problem would break production or lose data.
              Follow with a short list of the findings, most severe first, and what you checked.
            Be specific and brief. Never approve, request changes formally, push or merge.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"

      # The verdict becomes this check's status, so it shows beside the merge button.
      # A BLOCKING verdict turns it red; you can still merge — the decision stays yours.
      - name: Verdict
        if: env.HAS_CLAUDE_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json comments \
            --jq '[.comments[] | select(.body | startswith("<!-- agent-review -->"))] | last | .body // ""')
          verdict=$(printf '%s\n' "$body" | grep -m1 '^Verdict:' || true)
          echo "${verdict:-Verdict: (none posted)}"
          echo "### ${verdict:-Agent review posted no verdict}" >> "$GITHUB_STEP_SUMMARY"
          case "$verdict" in
            *BLOCKING*) echo "::error::The reviewer found blocking problems — see its comments on the PR."; exit 1 ;;
            "") echo "::error::The reviewer finished without posting a verdict."; exit 1 ;;
          esac
