# Production overrides for this specific server (valentintruta.ro's backend VPS).
# Use alongside the base file, never alone — it only overrides what differs:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Two things this file exists to fix, neither optional:
#
#  1. The base file hardcodes dev-only credentials (POSTGRES_PASSWORD: albumflow,
#     MINIO_ROOT_PASSWORD: albumflow123) directly as literals. Those are fine for
#     a laptop nobody else can reach; they cannot go anywhere real. Every secret
#     below is substituted from environment variables that Docker Compose reads
#     from a `.env` file in this same directory — a file that lives ONLY on the
#     server, is created once from `.env.production.example`, and is never
#     committed, never synced by the deploy job, never touched by a redeploy.
#
#  2. The base file publishes Postgres (5432), Redis (6379) and MinIO (9000/9001)
#     straight to the host, because that's convenient for local development.
#     Removing the port mappings here doesn't break anything — every service
#     still reaches every other service by name over the compose network Docker
#     creates automatically (`api` already talks to `postgres:5432`, not
#     `localhost:5432`). It just stops those ports from being reachable from the
#     internet. Caddy is the only process this box exposes publicly.
name: albumflow

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    ports: !reset []

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}

  minio-init:
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} &&
      mc mb -p local/albumflow-photos &&
      mc anonymous set download local/albumflow-photos
      "

  api:
    ports: !reset []
    environment:
      DATABASE_URL: postgres://albumflow:${POSTGRES_PASSWORD}@postgres:5432/albumflow
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # This one the browser opens directly, so it has to be the public,
      # TLS-terminated hostname — never the internal docker-network one.
      S3_PUBLIC_ENDPOINT: https://storage.valentintruta.ro
      S3_BUCKET: albumflow-photos
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      WEB_ORIGIN: https://app.valentintruta.ro
      VISION_PROVIDER: ${VISION_PROVIDER:-heuristic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  worker:
    environment:
      DATABASE_URL: postgres://albumflow:${POSTGRES_PASSWORD}@postgres:5432/albumflow
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://storage.valentintruta.ro
      S3_BUCKET: albumflow-photos
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      WEB_ORIGIN: https://app.valentintruta.ro
      VISION_PROVIDER: ${VISION_PROVIDER:-heuristic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  # The web app is not deployed here at all — it's static, and it lives on
  # cPanel via FTP (see docs/deploy-valentintruta.md). Nothing in this file
  # starts the `web` service; the deploy job never lists it.

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - minio

volumes:
  caddy-data:
  caddy-config:
